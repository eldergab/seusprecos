
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sistema de Cardápio - Página Inicial</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    background: #222;
    color: #eee;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
  }
  .sidebar {
    width: 220px;
    background: #333;
    padding: 20px;
    overflow-y: auto;
  }
  .sidebar .logo {
    width: 180px;
    margin-bottom: 15px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .sidebar h2 {
    color: #ffa500;
    margin-bottom: 15px;
  }
  .category-list {
    list-style: none;
    padding: 0;
  }
  .category-list li {
    padding: 10px;
    margin-bottom: 8px;
    background: #444;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  .category-list li:hover,
  .category-list li.active {
    background-color: #ffa500;
    color: #222;
  }
  .category-list li.loading {
    cursor: default;
    background: transparent;
    color: #aaa;
  }
  .commerce-list a {
    text-decoration: none;
    color: inherit;
  }
  .content {
    flex-grow: 1;
    padding: 20px;
    overflow-y: auto;
  }
  .commerce-list {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
  }
  .commerce-card {
    background: #333;
    border-radius: 8px;
    width: 180px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    transition: box-shadow 0.3s ease;
  }
  .commerce-card:hover {
    box-shadow: 0 0 10px #ffa500;
  }
  .commerce-card img {
    max-width: 100%;
    height: 100px;
    object-fit: contain;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .commerce-card h3 {
    margin: 0;
    font-size: 1.1rem;
    color: #ffa500;
  }

  /* Responsive styles */
  @media (max-width: 768px) {
    body {
      flex-direction: column;
      height: auto;
    }
    .sidebar {
      width: 100%;
      padding: 10px;
      overflow-y: visible;
    }
    .content {
      padding: 10px;
    }
    .commerce-list {
      justify-content: center;
    }
    .commerce-card {
      width: 90%;
      max-width: 300px;
      margin: 0 auto 15px auto;
    }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <img src="logo-seusprecos.png" alt="Seus Preços Logo" class="logo" />
    <h2>Categorias</h2>
    <ul class="category-list" id="category-list"></ul>
  </aside>
  <main class="content">
    <h2 id="commerce-title">Comércios</h2>
    <div class="commerce-list" id="commerce-list"></div>
  </main>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

  const categoryListEl = document.getElementById('category-list');
  const commerceListEl = document.getElementById('commerce-list');
  const commerceTitleEl = document.getElementById('commerce-title');

  let allCategories = [];
  let allCommerces = [];

  // Carrega categorias do Firestore
  async function loadCategories() {
    const categoriesCol = collection(db, "categories");
    const categorySnapshot = await getDocs(categoriesCol);
    allCategories = categorySnapshot.docs.map(doc => doc.data().name).sort();
  }

  // Carrega comércios do Firestore
  async function loadCommerces() {
    const commercesCol = collection(db, "commerces");
    const commerceSnapshot = await getDocs(commercesCol);
    allCommerces = commerceSnapshot.docs.map(doc => doc.data());
  }

  // Renderiza lista de categorias
  function renderCategories() {
    categoryListEl.innerHTML = '';
    allCategories.forEach((cat, index) => {
      const li = document.createElement('li');
      li.textContent = cat;
      li.dataset.index = index;
      li.setAttribute('role', 'button');
      li.setAttribute('tabindex', '0');

      const selectCategory = () => {
        // Remove active class from all other items
        categoryListEl.querySelectorAll('li').forEach(item => item.classList.remove('active'));
        // Add active class to the clicked one
        li.classList.add('active');
        // Render commerces for this category
        commerceTitleEl.textContent = `Comércios em "${cat}"`;
        renderCommercesByCategory(cat);
      };

      li.addEventListener('click', selectCategory);
      li.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          selectCategory();
        }
      });
      categoryListEl.appendChild(li);
    });

    // Set the first category as active by default
    if (allCategories.length > 0) {
      categoryListEl.querySelector('li').classList.add('active');
      commerceTitleEl.textContent = `Comércios em "${allCategories[0]}"`;
      renderCommercesByCategory(allCategories[0]);
    }
  }

  // Renderiza comércios da categoria selecionada
  function renderCommercesByCategory(category) {
    commerceListEl.innerHTML = '';
    const filtered = allCommerces.filter(c => c.category === category);
    if (filtered.length === 0) {
      commerceListEl.textContent = 'Nenhum comércio nesta categoria.';
      return;
    }
    filtered.forEach(commerce => {
      const link = document.createElement('a');
      link.href = `index2.html?commerce=${encodeURIComponent(commerce.name)}`;

      const card = document.createElement('div');
      card.className = 'commerce-card';
      card.innerHTML = `
        <img src="${commerce.logoUrl}" alt="${commerce.name}" onerror="this.onerror=null;this.src='https://via.placeholder.com/150?text=Logo'"/>
        <h3>${commerce.name}</h3>
      `;

      link.appendChild(card);
      commerceListEl.appendChild(link);
    });
  }

  // Initial load
  async function initializeApp() {
    categoryListEl.innerHTML = '<li class="loading">Carregando...</li>';
    commerceListEl.textContent = 'Carregando...';
    try {
      await Promise.all([loadCategories(), loadCommerces()]);
      renderCategories();
      // The first renderCommercesByCategory is called inside renderCategories
    } catch (error) {
      console.error("Falha ao inicializar o aplicativo:", error);
      categoryListEl.innerHTML = '<li class="loading">Falha ao carregar.</li>';
      commerceListEl.textContent = 'Não foi possível carregar os dados. Por favor, tente novamente mais tarde.';
    }
  }

  initializeApp();
</script>
</body>
</html>
