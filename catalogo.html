<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadastro de Cardápio - Sistema de Cardápio</title>
<link rel="manifest" href="manifest.json" />
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(registration => {
          console.log('Service Worker registrado com sucesso:', registration.scope);
        })
        .catch(error => {
          console.log('Falha ao registrar Service Worker:', error);
        });
    });
  }
</script>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #222;
    color: #eee;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 700px;
    margin: 20px auto;
    background: #333;
    padding: 20px;
    border-radius: 8px;
  }
  h1, h2 {
    color: #ffa500;
  }
  label {
    display: block;
    margin-top: 10px;
  }
  input, select, button, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
  }
  button {
    background: #ffa500;
    color: #222;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
  }
  button:hover {
    background: #e59400;
  }
  .list-section {
    margin-top: 30px;
  }
  .list-item {
    background: #444;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .list-item div {
    flex-grow: 1;
  }
  .list-item button {
    width: auto;
    padding: 5px 10px;
    margin-left: 5px;
  }
</style>
</head>
<body>
<div class="container" id="login-container" style="display: block;">
  <h1>Login</h1>
  <button id="google-login-btn" style="width: 100%; padding: 10px; margin-top: 15px; background-color: #ffa500; color: #222; font-weight: bold; border: none; border-radius: 6px; cursor: pointer;">Entrar com Google</button>
</div>

<div class="container hidden" id="catalog-panel" style="display: none;">
  <h1>Cadastro de Cardápio</h1>

  <label for="commerce-select">Selecione o Comércio:</label>
  <select id="commerce-select"></select>

  <form id="product-form">
    <label for="product-name">Nome do Produto:</label>
    <input type="text" id="product-name" required />

    <label for="product-type">Tipo:</label>
    <select id="product-type" required>
      <option value="und">Unidade</option>
      <option value="kg">Kg</option>
      <option value="peca">Peça</option>
      <option value="litro">Litro</option>
      <option value="ml">ml</option>
      <option value="porcao">Porção</option>
    </select>

    <label for="product-description">Descrição:</label>
    <textarea id="product-description" rows="3" required></textarea>

    <label for="product-price">Valor (R$):</label>
    <input type="number" id="product-price" step="0.01" min="0" required />

    <button type="submit">Adicionar Produto</button>
  </form>

  <div class="list-section" id="product-list"></div>
</div>

<script type="module">
  import { db, auth, provider } from './firebase-config.js';
  import { collection, getDocs, addDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
  import { signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

  const loginContainer = document.getElementById('login-container');
  const catalogPanel = document.getElementById('catalog-panel');
  const commerceSelect = document.getElementById('commerce-select');
  const productForm = document.getElementById('product-form');
  const productList = document.getElementById('product-list');

  let currentUser = null;

  // Carrega comércios do Firestore para o select
  async function loadCommerces() {
    const commercesCol = collection(db, "commerces");
    const commerceSnapshot = await getDocs(commercesCol);
    return commerceSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  }

  // Carrega produtos do Firestore
  async function loadProducts() {
    const productsCol = collection(db, "products");
    const productSnapshot = await getDocs(productsCol);
    return productSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  }

  // Salva produto no Firestore
  async function saveProduct(product) {
    const productsCol = collection(db, "products");
    await addDoc(productsCol, product);
  }

  // Exclui produto do Firestore
  async function deleteProduct(id) {
    await deleteDoc(doc(db, "products", id));
  }

  // Renderiza lista de produtos
  async function renderProducts() {
    const products = await loadProducts();
    productList.innerHTML = '';

    if (products.length === 0) {
      productList.innerHTML = '<li>Nenhum produto cadastrado.</li>';
      return;
    }

    products.forEach(product => {
      const li = document.createElement('li');
      li.className = 'product-item';

      li.innerHTML = `
        <h3>${product.name} (${product.type})</h3>
        <p>${product.description}</p>
        <p class="product-price">R$ ${product.price.toFixed(2)}</p>
      `;

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = 'Excluir';
      delBtn.onclick = async () => {
        if (confirm(`Excluir produto "${product.name}"?`)) {
          await deleteProduct(product.id);
          await renderProducts();
        }
      };

      li.appendChild(delBtn);
      productList.appendChild(li);
    });
  }

  // Preenche select de comércios
  async function populateCommerceSelect() {
    const commerces = await loadCommerces();
    commerceSelect.innerHTML = '';
    commerces.forEach(commerce => {
      const option = document.createElement('option');
      option.value = commerce.name;
      option.textContent = commerce.name;
      commerceSelect.appendChild(option);
    });
  }

  // Evento submit do formulário
  productForm.addEventListener('submit', async e => {
    e.preventDefault();
    const commerce = commerceSelect.value;
    const name = document.getElementById('product-name').value.trim();
    const type = document.getElementById('product-type').value.trim();
    const description = document.getElementById('product-description').value.trim();
    const price = parseFloat(document.getElementById('product-price').value);

    if (commerce && name && type && description && !isNaN(price)) {
      await saveProduct({ commerce, name, type, description, price });
      await renderProducts();
      productForm.reset();
    } else {
      alert('Preencha todos os campos corretamente.');
    }
  });

  // Login com Google
  async function login() {
    try {
      const result = await signInWithPopup(auth, provider);
      currentUser = result.user;
      const commercesCol = collection(db, "commerces");
      const q = query(commercesCol, where("email", "==", currentUser.email));
      const querySnapshot = await getDocs(q);
      if (!querySnapshot.empty) {
        // Usuário autorizado
        loginContainer.style.display = 'none';
        catalogPanel.style.display = 'block';
        await populateCommerceSelect();
        await renderProducts();
      } else {
        alert('Acesso negado. Você não está cadastrado como comerciante.');
        await signOut(auth);
        loginContainer.style.display = 'block';
        catalogPanel.style.display = 'none';
      }
    } catch (error) {
      console.error('Erro no login:', error);
      alert('Falha no login. Tente novamente.');
    }
  }

  // Monitorar estado de autenticação
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      loginContainer.style.display = 'none';
      catalogPanel.style.display = 'block';
      populateCommerceSelect();
      renderProducts();
    } else {
      currentUser = null;
      loginContainer.style.display = 'block';
      catalogPanel.style.display = 'none';
    }
  });

  // Inicialização
  loginContainer.style.display = 'block';
  catalogPanel.style.display = 'none';

  const loginButton = document.getElementById('google-login-btn');
  loginButton.addEventListener('click', login);
</script>
</body>
</html>
