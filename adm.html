<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administração - Sistema de Cardápio</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    background: #222;
    color: #eee;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 900px;
    margin: 20px auto;
    background: #333;
    padding: 20px;
    border-radius: 8px;
  }
  h1, h2 {
    color: #ffa500;
  }
  label {
    display: block;
    margin-top: 10px;
  }
  input, select, button, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
  }
  button {
    background: #ffa500;
    color: #222;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
  }
  button:hover {
    background: #e59400;
  }
  .hidden {
    display: none;
  }
  .error {
    color: #f44336;
    margin-top: 5px;
  }
  .list-section {
    margin-top: 30px;
  }
  .list-item {
    background: #444;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .list-item img {
    height: 40px;
    margin-right: 10px;
    border-radius: 4px;
  }
  .list-item div {
    flex-grow: 1;
  }
  .list-item button {
    width: auto;
    padding: 5px 10px;
    margin-left: 5px;
  }

  /* Responsive styles */
  @media (max-width: 768px) {
    .container {
      width: 95%;
      margin: 10px auto;
      padding: 10px;
    }
    form {
      font-size: 0.9rem;
    }
    input, select, button, textarea {
      font-size: 1rem;
    }
    .list-item {
      flex-direction: column;
      align-items: flex-start;
    }
    .list-item img {
      margin-bottom: 10px;
      height: 60px;
    }
    .list-item button {
      margin-left: 0;
      margin-top: 10px;
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="container" id="login-container">
  <h1>Login Administrativo</h1>
  <form id="login-form">
    <label for="username">Usuário:</label>
    <input type="text" id="username" required />
    <label for="password">Senha:</label>
    <input type="password" id="password" required />
    <button type="submit">Entrar</button>
    <p class="error" id="login-error" style="display:none;">Usuário ou senha incorretos.</p>
  </form>
</div>

<div class="container hidden" id="admin-panel">
  <h1>Administração do Sistema de Cardápio</h1>

  <section id="commerce-section">
    <h2>Cadastro de Comércio</h2>
    <form id="commerce-form">
      <label for="logo-upload">Logomarca (upload de imagem):</label>
      <input type="file" id="logo-upload" accept="image/*" required />
      <input type="hidden" id="logo-base64" />

      <label for="commerce-name">Nome do Comércio:</label>
      <input type="text" id="commerce-name" required />

      <label for="whatsapp-number">Número do WhatsApp:</label>
      <input type="text" id="whatsapp-number" placeholder="(xx) xxxxx-xxxx" required />

      <label for="email">Email:</label>
      <input type="email" id="email" required />

      <label for="cnpj-cpf">CNPJ ou CPF:</label>
      <input type="text" id="cnpj-cpf" required />

      <label for="commerce-category">Categoria:</label>
      <select id="commerce-category"></select>

      <button type="submit">Cadastrar Comércio</button>
    </form>

    <div class="list-section" id="commerce-list"></div>
  </section>

  <section id="category-section">
    <h2>Cadastro de Categorias</h2>
    <form id="category-form">
      <label for="new-category">Nova Categoria:</label>
      <input type="text" id="new-category" required />
      <button type="submit">Adicionar Categoria</button>
    </form>

    <div class="list-section" id="category-list"></div>
  </section>
</div>

<script type="module">
  import { db, auth, provider } from './firebase-config.js';
  import { collection, getDocs, addDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
  import { signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

  const loginContainer = document.getElementById('login-container');
  const adminPanel = document.getElementById('admin-panel');
  const loginError = document.getElementById('login-error');

  const commerceForm = document.getElementById('commerce-form');
  const commerceCategorySelect = document.getElementById('commerce-category');
  const commerceListDiv = document.getElementById('commerce-list');

  const categoryForm = document.getElementById('category-form');
  const categoryListDiv = document.getElementById('category-list');
  const newCategoryInput = document.getElementById('new-category');

  let currentUser = null;

  // Categorias padrão
  const defaultCategories = [
    "Bares",
    "Restaurantes",
    "Lanchonetes",
    "Padarias",
    "Pizzarias",
    "Sorveterias",
    "Supermercados",
    "Diversão",
    "Lazer",
    "Entretenimento",
    "Fast Food",
    "Comida Rápida"
  ];

  // Função para carregar categorias do Firestore ou usar padrão
  async function loadCategories() {
    try {
      const categoriesCol = collection(db, "categories");
      const categorySnapshot = await getDocs(categoriesCol);
      return categorySnapshot.docs.map(doc => ({ id: doc.id, name: doc.data().name }));
    } catch (error) {
      console.error("Erro ao carregar categorias:", error);
      alert("Erro ao carregar categorias. Verifique a conexão com o Firestore.");
      return [];
    }
  }

  // Função para garantir que todas as categorias padrão existam no Firestore
  async function ensureDefaultCategories() {
    try {
      const categoriesCol = collection(db, "categories");
      const categorySnapshot = await getDocs(categoriesCol);
      const existingCategories = categorySnapshot.docs.map(doc => doc.data().name);
      for (const cat of defaultCategories) {
        if (!existingCategories.includes(cat)) {
          await addDoc(categoriesCol, { name: cat });
        }
      }
    } catch (error) {
      console.error("Erro ao garantir categorias padrão:", error);
      alert("Erro ao garantir categorias padrão. Verifique a conexão com o Firestore.");
    }
  }

  // Função para salvar categoria no Firestore
  async function saveCategory(name) {
    try {
      const categoriesCol = collection(db, "categories");
      await addDoc(categoriesCol, { name, userId: currentUser.uid });
    } catch (error) {
      console.error("Erro ao salvar categoria:", error);
      alert("Erro ao salvar categoria. Verifique a conexão com o Firestore.");
      throw error; // Re-throw to handle in caller
    }
  }

  // Função para excluir categoria do Firestore
  async function deleteCategory(id) {
    try {
      await deleteDoc(doc(db, "categories", id));
    } catch (error) {
      console.error("Erro ao excluir categoria:", error);
      alert("Erro ao excluir categoria. Verifique a conexão com o Firestore.");
    }
  }

  // Função para carregar comércios do Firestore
  async function loadCommerces() {
    try {
      const commercesCol = collection(db, "commerces");
      const q = query(commercesCol, where("userId", "==", currentUser.uid));
      const commerceSnapshot = await getDocs(q);
      return commerceSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    } catch (error) {
      console.error("Erro ao carregar comércios:", error);
      alert("Erro ao carregar comércios. Verifique a conexão com o Firestore.");
      return [];
    }
  }

  // Função para salvar comércio no Firestore
  async function saveCommerce(commerce) {
    try {
      const commercesCol = collection(db, "commerces");
      await addDoc(commercesCol, { ...commerce, userId: currentUser.uid });
    } catch (error) {
      console.error("Erro ao salvar comércio:", error);
      alert("Erro ao salvar comércio. Verifique a conexão com o Firestore.");
      throw error; // Re-throw to handle in caller
    }
  }

  // Função para excluir comércio do Firestore
  async function deleteCommerce(id) {
    try {
      await deleteDoc(doc(db, "commerces", id));
    } catch (error) {
      console.error("Erro ao excluir comércio:", error);
      alert("Erro ao excluir comércio. Verifique a conexão com o Firestore.");
    }
  }

  // Renderiza lista de categorias no select e na listagem
  async function renderCategories() {
    await ensureDefaultCategories();
    const categories = await loadCategories();
    commerceCategorySelect.innerHTML = '';
    categoryListDiv.innerHTML = '';

    categories.forEach(cat => {
      const option = document.createElement('option');
      option.value = cat.name || cat;
      option.textContent = cat.name || cat;
      commerceCategorySelect.appendChild(option);

      const div = document.createElement('div');
      div.className = 'list-item';
      div.textContent = cat.name || cat;

      if (cat.id) {
        const delBtn = document.createElement('button');
        delBtn.textContent = 'Excluir';
        delBtn.onclick = async () => {
          if (confirm(`Excluir categoria "${cat.name}"?`)) {
            await deleteCategory(cat.id);
            await renderCategories();
          }
        };
        div.appendChild(delBtn);
      }

      categoryListDiv.appendChild(div);
    });
  }

  // Renderiza lista de comércios cadastrados
  async function renderCommerces() {
    const commerces = await loadCommerces();
    commerceListDiv.innerHTML = '';

    commerces.forEach(commerce => {
      const div = document.createElement('div');
      div.className = 'list-item';

      const img = document.createElement('img');
      img.src = commerce.logoUrl || '';
      img.alt = commerce.name;

      const infoDiv = document.createElement('div');
      infoDiv.innerHTML = `<strong>${commerce.name}</strong><br/>WhatsApp: ${commerce.whatsapp}<br/>Email: ${commerce.email}<br/>CNPJ/CPF: ${commerce.cnpjCpf}<br/>Categoria: ${commerce.category}`;

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Excluir';
      delBtn.onclick = async () => {
        if (confirm(`Excluir comércio "${commerce.name}"?`)) {
          await deleteCommerce(commerce.id);
          await renderCommerces();
        }
      };

      div.appendChild(img);
      div.appendChild(infoDiv);
      div.appendChild(delBtn);
      commerceListDiv.appendChild(div);
    });
  }

  // Remove old login form event listener and replace with Google login
  const loginForm = document.getElementById('login-form');
  if (loginForm) {
    loginForm.remove();
  }

  // Login with Google
  async function login() {
    try {
      const result = await signInWithPopup(auth, provider);
      currentUser = result.user;
      loginContainer.style.display = 'none';
      adminPanel.style.display = 'block';
      await renderCategories();
      await renderCommerces();
    } catch (error) {
      console.error('Login failed:', error);
      alert('Falha no login. Tente novamente.');
    }
  }

  // Logout
  async function logout() {
    await signOut(auth);
    currentUser = null;
    loginContainer.style.display = 'block';
    adminPanel.style.display = 'none';
  }

  // Monitor auth state
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      loginContainer.style.display = 'none';
      adminPanel.style.display = 'block';
      renderCategories();
      renderCommerces();
    } else {
      currentUser = null;
      loginContainer.style.display = 'block';
      adminPanel.style.display = 'none';
    }
  });

  // Replace old login form with Google login button
  loginContainer.innerHTML = `
    <h1>Login Administrativo</h1>
    <button id="google-login-btn">Entrar com Google</button>
  `;

  document.getElementById('google-login-btn').addEventListener('click', login);

  // Add profile and logout buttons fixed in top right
  const headerDiv = document.createElement('div');
  headerDiv.style.position = 'fixed';
  headerDiv.style.top = '10px';
  headerDiv.style.right = '10px';
  headerDiv.style.zIndex = '1000';
  headerDiv.style.display = 'flex';
  headerDiv.style.gap = '10px';

  const profileBtn = document.createElement('button');
  profileBtn.textContent = 'Perfil';
  profileBtn.style.background = '#ffa500';
  profileBtn.style.color = '#222';
  profileBtn.style.border = 'none';
  profileBtn.style.padding = '8px 12px';
  profileBtn.style.borderRadius = '6px';
  profileBtn.style.cursor = 'pointer';
  profileBtn.style.fontWeight = 'bold';
  profileBtn.addEventListener('click', () => {
    alert(`Usuário: ${currentUser.email}`);
  });

  const logoutBtn = document.createElement('button');
  logoutBtn.textContent = 'Sair';
  logoutBtn.style.background = '#ffa500';
  logoutBtn.style.color = '#222';
  logoutBtn.style.border = 'none';
  logoutBtn.style.padding = '8px 12px';
  logoutBtn.style.borderRadius = '6px';
  logoutBtn.style.cursor = 'pointer';
  logoutBtn.style.fontWeight = 'bold';
  logoutBtn.addEventListener('click', logout);

  headerDiv.appendChild(profileBtn);
  headerDiv.appendChild(logoutBtn);
  document.body.appendChild(headerDiv);

  // Cadastro de categoria
  categoryForm.addEventListener('submit', async e => {
    e.preventDefault();
    const newCat = newCategoryInput.value.trim();
    if (newCat) {
      try {
        const categories = await loadCategories();
        if (!categories.some(c => c.name === newCat)) {
          await saveCategory(newCat);
          await renderCategories();
          newCategoryInput.value = '';
        } else {
          alert('Categoria já existe.');
        }
      } catch (error) {
        console.error("Erro no cadastro de categoria:", error);
        alert("Erro ao cadastrar categoria. Tente novamente.");
      }
    }
  });

  // Cadastro de comércio
  // Adiciona conversão da imagem para base64 antes do submit
  const logoUploadInput = document.getElementById('logo-upload');
  logoUploadInput.addEventListener('change', () => {
    const file = logoUploadInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('logo-base64').value = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  commerceForm.addEventListener('submit', async e => {
    e.preventDefault();
    const logoBase64 = document.getElementById('logo-base64').value.trim();
    const name = document.getElementById('commerce-name').value.trim();
    const whatsapp = document.getElementById('whatsapp-number').value.trim();
    const email = document.getElementById('email').value.trim();
    const cnpjCpf = document.getElementById('cnpj-cpf').value.trim();
    const category = commerceCategorySelect.value;

    if (logoBase64 && name && whatsapp && email && cnpjCpf && category) {
      try {
        await saveCommerce({ logoUrl: logoBase64, name, whatsapp, email, cnpjCpf, category });
        await renderCommerces();
        commerceForm.reset();
        document.getElementById('logo-upload').value = '';
        document.getElementById('logo-base64').value = '';
      } catch (error) {
        console.error("Erro no cadastro de comércio:", error);
        alert("Erro ao cadastrar comércio. Tente novamente.");
      }
    } else {
      alert('Preencha todos os campos.');
    }
  });
</script>
</body>
</html>
