<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administração - Sistema de Cardápio</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #222;
    color: #eee;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 900px;
    margin: 20px auto;
    background: #333;
    padding: 20px;
    border-radius: 8px;
  }
  h1, h2 { color: #ffa500; }
  label { display: block; margin-top: 10px; }
  input, select, button, textarea {
    width: 100%; padding: 8px; margin-top: 5px;
    border-radius: 6px; border: none; font-size: 1rem;
  }
  button { background: #ffa500; color: #222; font-weight: bold; cursor: pointer; margin-top: 15px; }
  button:hover { background: #e59400; }
  .hidden { display: none; }
  .error { color: #f44336; margin-top: 5px; }
  .list-section { margin-top: 30px; }
  .list-item {
    background: #444; padding: 10px; margin-top: 10px; border-radius: 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .list-item img { height: 40px; margin-right: 10px; border-radius: 4px; }
  .list-item div { flex-grow: 1; }
  .list-item button { width: auto; padding: 5px 10px; margin-left: 5px; }
  .notice {
    margin: 10px 0 0; padding: 10px; border-radius: 6px;
    background: #2b3a2b; border-left: 4px solid #ffa500; color: #d2ffd2;
  }
  .notice.error { background: #3a2b2b; color: #ffd2d2; border-left-color: #f44336; }
</style>
</head>
<body>
<div class="container" id="login-container">
  <h1>Login Administrativo</h1>
  <form id="login-form">
    <label for="username">Usuário:</label>
    <input type="text" id="username" required />
    <label for="password">Senha:</label>
    <input type="password" id="password" required />
    <button type="submit">Entrar</button>
    <p class="error" id="login-error" style="display:none;">Usuário ou senha incorretos.</p>
  </form>
</div>
