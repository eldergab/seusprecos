<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu do Comércio</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #222;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  #commerce-info {
    margin-bottom: 20px;
  }
  #commerce-info img {
    max-width: 200px;
    border-radius: 8px;
  }
  .product-item {
    background: #333;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 8px;
  }
  .product-item h3 {
    margin: 0 0 10px 0;
    color: #ffa500;
  }
  .product-item a {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    background-color: #25d366;
    color: white;
    text-decoration: none;
    border-radius: 6px;
  }
  .product-item a:hover {
    background-color: #1ebe57;
  }
</style>
</head>
<body>
  <div id="commerce-info"></div>
  <div id="product-list"></div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

  // Obtém o parâmetro "commerce" da URL
  const urlParams = new URLSearchParams(window.location.search);
  const commerceName = urlParams.get('commerce');

  const commerceInfoDiv = document.getElementById('commerce-info');
  const productListDiv = document.getElementById('product-list');

  // Carrega dados do comércio pelo nome
  async function loadCommerceByName(name) {
    const commercesCol = collection(db, "commerces");
    const q = query(commercesCol, where("name", "==", name));
    const querySnapshot = await getDocs(q);
    if (!querySnapshot.empty) {
      return querySnapshot.docs[0].data();
    }
    return null;
  }

  // Carrega produtos do comércio
  async function loadProductsByCommerce(name) {
    const productsCol = collection(db, "products");
    const q = query(productsCol, where("commerce", "==", name));
    const querySnapshot = await getDocs(q);
    return querySnapshot.docs.map(doc => doc.data());
  }

  // Renderiza informações do comércio
  async function renderCommerceInfo() {
    const commerce = await loadCommerceByName(commerceName);
    if (!commerce) {
      commerceInfoDiv.textContent = "Comércio não encontrado.";
      return;
    }
    commerceInfoDiv.innerHTML = `
      <h2>${commerce.name}</h2>
      <img src="${commerce.logoUrl}" alt="${commerce.name}" />
      <p>WhatsApp: ${commerce.whatsapp}</p>
      <p>Email: ${commerce.email}</p>
      <p>CNPJ/CPF: ${commerce.cnpjCpf}</p>
      <p>Categoria: ${commerce.category}</p>
    `;
  }

  // Renderiza lista de produtos com links para WhatsApp
  async function renderProductList() {
    const commerce = await loadCommerceByName(commerceName);
    if (!commerce) {
      productListDiv.textContent = "Comércio não encontrado.";
      return;
    }
    const products = await loadProductsByCommerce(commerceName);
    productListDiv.innerHTML = '';
    if (products.length === 0) {
      productListDiv.textContent = "Nenhum produto cadastrado para este comércio.";
      return;
    }
    products.forEach(product => {
      const productDiv = document.createElement('div');
      productDiv.className = 'product-item';
      const whatsappLink = `https://wa.me/${commerce.whatsapp.replace(/\D/g, '')}?text=Olá,%20gostaria%20de%20saber%20mais%20sobre%20o%20produto%20${encodeURIComponent(product.name)}`;
      productDiv.innerHTML = `
        <h3>${product.name}</h3>
        <p>${product.description}</p>
        <p>Preço: R$ ${product.price.toFixed(2)}</p>
        <a href="${whatsappLink}" target="_blank" rel="noopener noreferrer">Contato via WhatsApp</a>
      `;
      productListDiv.appendChild(productDiv);
    });
  }

  // Inicialização
  (async () => {
    await renderCommerceInfo();
    await renderProductList();
  })();
</script>
</body>
</html>
