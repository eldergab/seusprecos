<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cardápio do Comércio - Sistema de Cardápio</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #222;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #ffa500;
  }
  .commerce-info {
    margin-bottom: 20px;
  }
  .commerce-logo {
    max-height: 100px;
    margin-bottom: 10px;
  }
  .product-list {
    list-style: none;
    padding: 0;
  }
  .product-item {
    background: #333;
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 8px;
  }
  .product-item h3 {
    margin: 0 0 5px 0;
    color: #ffa500;
  }
  .product-item p {
    margin: 0 0 5px 0;
  }
  .product-price {
    font-weight: bold;
  }
  .whatsapp-link {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background: #25d366;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
  }
  .whatsapp-link:hover {
    background: #1ebe57;
  }
</style>
</head>
<body>
  <div id="commerce-container">
    <h1 id="commerce-name"></h1>
    <img id="commerce-logo" class="commerce-logo" src="" alt="Logomarca do comércio" />
    <p id="commerce-whatsapp"></p>
    <a id="whatsapp-link" class="whatsapp-link" href="#" target="_blank">Entrar em contato pelo WhatsApp</a>
  </div>

  <h2>Cardápio</h2>
  <ul id="product-list" class="product-list"></ul>

<script>
  // Função para obter parâmetro da URL
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  // Carrega comércios e produtos do localStorage
  function loadCommerces() {
    const commerces = localStorage.getItem('commerces');
    return commerces ? JSON.parse(commerces) : [];
  }

  function loadProducts() {
    const products = localStorage.getItem('products');
    return products ? JSON.parse(products) : [];
  }

  // Renderiza cardápio do comércio selecionado
  function renderMenu(commerceName) {
    const commerces = loadCommerces();
    const products = loadProducts();

    const commerce = commerces.find(c => c.name === commerceName);
    if (!commerce) {
      document.body.innerHTML = '<p>Comércio não encontrado.</p>';
      return;
    }

    document.getElementById('commerce-name').textContent = commerce.name;
    document.getElementById('commerce-logo').src = commerce.logoUrl || '';
    document.getElementById('commerce-logo').alt = `Logomarca de ${commerce.name}`;
    document.getElementById('commerce-whatsapp').textContent = `WhatsApp: ${commerce.whatsapp}`;

    const whatsappLink = document.getElementById('whatsapp-link');
    let phone = commerce.whatsapp.replace(/\D/g, '');
    if (!phone.startsWith('55')) {
      phone = '55' + phone;
    }
    whatsappLink.href = `https://wa.me/${phone}`;
    whatsappLink.textContent = `Entrar em contato pelo WhatsApp`;

    const productList = document.getElementById('product-list');
    productList.innerHTML = '';

    const filteredProducts = products.filter(p => p.commerce === commerceName);
    if (filteredProducts.length === 0) {
      productList.innerHTML = '<li>Nenhum produto cadastrado para este comércio.</li>';
      return;
    }

    filteredProducts.forEach(product => {
      const li = document.createElement('li');
      li.className = 'product-item';
      li.innerHTML = `
        <h3>${product.name} (${product.type})</h3>
        <p>${product.description}</p>
        <p class="product-price">R$ ${product.price.toFixed(2)}</p>
        <a href="https://wa.me/${phone}?text=Olá,%20gostaria%20de%20saber%20mais%20sobre%20o%20produto%20${encodeURIComponent(product.name)}" target="_blank" class="whatsapp-link">Comprar via WhatsApp</a>
      `;
      productList.appendChild(li);
    });
  }

  const commerceName = getQueryParam('commerce');
  if (commerceName) {
    renderMenu(decodeURIComponent(commerceName));
  } else {
    document.body.innerHTML = '<p>Comércio não especificado.</p>';
  }
</script>
</body>
</html>
